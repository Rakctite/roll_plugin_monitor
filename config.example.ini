[monitor]
mqtt_host = 192.168.0.30
mqtt_port = 1883
topics = C-S/+/+/+/+/+/+/+/data,iot/IPR/#
grid_columns = 16
grid_rows = 9
object_count = 3
left_tags = left,left_thickness
right_tags = right,right_thickness
roll_temp_tags = temperature,roll_temp,temp
stale_sec = 5
fullscreen = true
display_interval_ms = 200
log_file = /app/logs/roll_plugin_monitor.log

[object.1]
label = LEFT
unit = mm
style = 1
topic = iot/IPR/roll
sensor_name = left_thickness
x = 1
y = 1
w = 5
h = 3

[object.2]
label = RIGHT
unit = mm
style = 1
topic = iot/IPR/roll
sensor_name = right_thickness
x = 6
y = 1
w = 5
h = 3

[object.3]
label = ROLL TEMP
unit = C
style = 1
topic = iot/IPR/roll
sensor_name = roll_temp
x = 11
y = 1
w = 5
h = 3
